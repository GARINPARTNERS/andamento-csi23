<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Terminais CSMobi Leste SP</title>
<style>
:root{--bg:#f7f7f2;--ink:#1a1b12;--ink2:#4a4c3e;--line:#e2e2d6;--acc:#b8912f;--bar:#3f4029}
@media (prefers-color-scheme:dark){:root{--bg:#16170f;--ink:#f1f1e6;--ink2:#c4c5b3;--line:#34362a;--bar:#26271a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:var(--bar);color:#fff;border-bottom:3px solid var(--acc);padding:10px clamp(12px,3vw,28px) 0}
h1{margin:0 0 6px;font-size:clamp(18px,3vw,24px);font-weight:700}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:600 13px inherit;font-family:inherit;color:#d5d5c6;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
iframe[hidden]{display:none}
</style></head><body>
<header><h1>Terminais CSMobi Leste SP</h1>
<nav role="tablist"><button role="tab" data-t="andamento" aria-selected="true">Andamento projetos executivos</button><button role="tab" data-t="rnc" aria-selected="false">Controle RNC</button></nav></header>
<main><iframe id="f-andamento" src="andamento.html" title="Andamento projetos executivos"></iframe><iframe id="f-rnc" src="rnc.html" title="Controle RNC" hidden></iframe></main>
<script>
(function(){
var tabs=[].slice.call(document.querySelectorAll("nav button"));
function show(t){tabs.forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.t===t))});
 ["andamento","rnc"].forEach(function(k){document.getElementById("f-"+k).hidden=(k!==t)});
 try{history.replaceState(null,"","#"+t)}catch(e){}}
tabs.forEach(function(b){b.onclick=function(){show(b.dataset.t)}});
show(location.hash==="#rnc"?"rnc":"andamento");
})();
</script></body></html>
