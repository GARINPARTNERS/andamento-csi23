<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"></head><body><!-- andamento-sha:6014fe65f6247183 -->
<title>Andamento Projetos Executivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel operacional — fluxo de status no topo, filas de ação, agrupamentos, registro completo abaixo */
:root{
  --bg:#eef0ec; --surface:#ffffff; --surface-2:#f5f6f3; --line:#d6dbd4; --line-2:#e6e9e4;
  --ink:#17201b; --ink-2:#48534d; --ink-3:#77827b;
  --accent:#0b6e4f; --accent-ink:#ffffff;
  --voce:#b06a00; --proj:#2d5fa8; --apr:#2f7d4b; --sp:#7b4bb0; --fim:#56675e;
  --crit:#c23a2b; --warn:#b86e00; --ok:#2f7d4b;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171e1a; --surface-2:#1c2520; --line:#2c3731; --line-2:#242e29;
  --ink:#e5ebe7; --ink-2:#b1bcb6; --ink-3:#85918a;
  --accent:#3fbf8f; --accent-ink:#0b1a13;
  --voce:#f0a53a; --proj:#82abee; --apr:#62c78a; --sp:#bc98ea; --fim:#98a89f;
  --crit:#ff7c6d; --warn:#f0a53a; --ok:#62c78a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171e1a; --surface-2:#1c2520; --line:#2c3731; --line-2:#242e29;
  --ink:#e5ebe7; --ink-2:#b1bcb6; --ink-3:#85918a;
  --accent:#3fbf8f; --accent-ink:#0b1a13;
  --voce:#f0a53a; --proj:#82abee; --apr:#62c78a; --sp:#bc98ea; --fim:#98a89f;
  --crit:#ff7c6d; --warn:#f0a53a; --ok:#62c78a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.92em}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.title-block{display:flex;flex-direction:column;gap:6px;min-width:0}
.title-block h1{font-size:clamp(24px,3.2vw,34px);font-weight:800;line-height:1.05}
.title-block .sub{color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.today{font:500 12.5px var(--f-mono);color:var(--ink-3);margin-right:4px}
.dates{display:inline-flex;flex-direction:column;gap:2px;margin-right:4px}.dates .today{margin-right:0}
.today.upd{color:var(--ink-2)}.today.upd b{color:var(--ink);font-weight:600}

.banner{border:1px solid var(--line);background:var(--surface-2);padding:10px 14px;border-radius:var(--r);color:var(--ink-2)}
.banner[data-kind="info"]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));margin:6px 0}
.sec .banner{margin:6px 0}
.banner[data-kind="warn"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));}

/* flow */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stage{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px 14px 18px;border:0;border-right:1px solid var(--line-2);background:none;cursor:pointer;min-width:0}
.stage:last-child{border-right:0}
.flow.inpanel{margin:0 16px 16px;box-shadow:none}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.stage:hover{background:var(--surface-2)}
.stage[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.stage .who{font:600 10.5px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.stage .lbl{font:600 14px/1.25 var(--f-display);color:var(--ink)}
.stage .n{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:4px}
.stage .late{font-size:12px;color:var(--ink-3);min-height:18px}
.stage .late b{color:var(--crit);font-weight:600}
@media (max-width:980px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.stage:nth-child(3){border-right:0}.stage:nth-child(-n+3){border-bottom:1px solid var(--line-2)}}
@media (max-width:520px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{border-right:1px solid var(--line-2)!important;border-bottom:1px solid var(--line-2)}.stage:nth-child(2n){border-right:0!important}}

/* panels */
.cols{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;align-items:start}
.mtog{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.mtog .car{display:inline-block;width:14px;color:var(--ink-3);transition:transform .15s}.mtog[aria-expanded="false"] .car{transform:rotate(-90deg)}
.mtog .mn{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--ink)}
.mesa.fechada .panel-b{display:none}.mesa.fechada .panel-h{border-bottom:0}
.mesas-bar{display:flex;justify-content:flex-end;gap:8px;margin:-6px 0 -8px}
@media (max-width:1060px){.cols{grid-template-columns:1fr 1fr}.cols>:first-child{grid-column:1/-1}}
@media (max-width:680px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{font-size:17px;font-weight:700}
.panel-h .hint{font-size:12.5px;color:var(--ink-3)}
.panel-b{padding:6px 8px 10px;display:flex;flex-direction:column;min-width:0}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:0;background:none;padding:9px 8px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line-2);min-width:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .l1{display:flex;gap:8px;align-items:baseline;min-width:0}
.item .code{font:500 12.5px var(--f-mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rev{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.item .t{grid-column:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{grid-column:1;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .side{grid-column:2;grid-row:1/4;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.empty{padding:18px 10px;color:var(--ink-3);font-size:13px}
.more{align-self:flex-start;margin:6px 8px 0;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:500;padding:2px 0}

/* mesas por disciplina */
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line-2)}
.drow:last-child{border-bottom:0}
.drow .dn{min-width:0;display:flex;flex-direction:column;gap:1px;font-weight:500;overflow-wrap:anywhere}
.drow .dn small{font-weight:500;font-size:12px;color:var(--crit)}
.drow .dn small.ok{color:var(--ink-3)}
.sub-h>span:last-child{white-space:nowrap;text-align:right}
.drow .dq{font:700 16px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.msec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 4px;padding:10px 12px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--ink-3)) 15%,var(--surface));border-left:5px solid var(--c,var(--ink-3));font:800 13.5px/1.25 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.list > .msecw:first-child > .msec{margin-top:4px}
.msec>span:last-child{white-space:nowrap;text-align:right;font:700 14px var(--f-display);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.msec+.tsub{margin-top:4px}
.tsub{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;padding:8px 10px 6px;font:700 15px/1.25 var(--f-display);color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--surface));border-left:3px solid var(--tc);border-radius:4px;--tc:var(--c,var(--accent))}
.sub-h+.tsub{margin-top:2px}
button.tsub{width:100%;border:0;border-left:3px solid var(--tc);text-align:left;cursor:pointer;align-items:center}
button.tsub:hover{background:color-mix(in srgb,var(--tc) 15%,var(--surface))}
button.tsub:focus-visible{outline:2px solid var(--tc);outline-offset:1px}
.tsub .chev{display:inline-block;width:1em;margin-right:6px;transition:transform .15s;font-size:12px}
button.tsub[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tbody[hidden]{display:none}
.tsub span:last-child{font:500 12px var(--f-body);color:var(--ink-3);white-space:nowrap}
.tpills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.tpills button:hover{border-color:var(--ink-3)}
.tpills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tpills b{font-variant-numeric:tabular-nums;margin-left:4px}
.lgrp{display:flex;flex-direction:column;gap:10px}
.lgrp>*,.dlg-b>*{flex-shrink:0}
.lterm{border:1px solid var(--line-2);border-radius:6px}
.lterm>.lth{position:sticky;top:-16px;z-index:1;border-radius:6px 6px 0 0}
.lterm>.lth{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font:700 14.5px/1.25 var(--f-display);color:var(--apr);background:color-mix(in srgb,var(--apr) 9%,var(--surface));border-left:4px solid var(--apr)}
.ldisc>.ldh{display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--line-2);background:var(--surface-2);font-weight:600}
.ltog{flex:1;display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:9px 0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.ltog:hover{color:var(--accent)}
.ltog .chev{width:12px;color:var(--ink-3)}
.ltog .lcnt{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.ldisc>.ldh input,.ldoc input{accent-color:var(--accent)}
.ldisc details summary{list-style:none}
.ldoc{display:flex;gap:10px;align-items:flex-start;padding:6px 10px 6px 30px;border-top:1px solid var(--line-2);cursor:pointer;font-size:13.5px}
.ldoc .m{color:var(--ink-3);font-size:12px}
.fila tbody tr[draggable="true"]{cursor:grab}
.fila tbody tr.fdrag{opacity:.45}
.fila tbody tr.fover-a td{box-shadow:inset 0 3px 0 var(--accent)}
.fila tbody tr.fover-b td{box-shadow:inset 0 -3px 0 var(--accent)}
.fchk{margin:0 8px 0 0;vertical-align:middle;accent-color:var(--accent)}
.fila tbody tr.fsel td{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.fresp{max-width:190px;min-width:140px;font-size:13px;padding:4px 6px}
.fresp.vazio{color:var(--ink-3)}
.eq-l{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.eq-i{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px}
.eq-i img{width:26px;height:26px;border-radius:50%}
.eq-i span{flex:1}
.eq-r{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.eq-r button{display:flex;align-items:center;gap:10px;text-align:left;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer}
.eq-r button:hover{border-color:var(--accent)}
.eq-r img{width:24px;height:24px;border-radius:50%}
.fila tr.ffixend td{border-bottom:2px solid var(--accent)}
.fila .fokb{white-space:nowrap}.fila .fnova{display:block;margin-top:4px;font-size:11.5px;white-space:normal;max-width:150px;border-radius:6px;line-height:1.3;padding:3px 7px}.fok-l .fh-e{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.fila .fpin{font-size:11px;color:var(--accent);font-weight:600;display:block}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-bottom:1px solid var(--line-2);font-size:13px}
.fhandle{color:var(--ink-3);margin-right:6px;font-size:15px;cursor:grab}
.fmv{display:inline-flex;flex-direction:column;margin-left:6px;vertical-align:middle}
.fbtn{border:0;background:none;padding:0 3px;font-size:9px;line-height:1.1;color:var(--ink-3);cursor:pointer}
.fbtn:hover:not(:disabled){color:var(--accent)}
.fbtn:disabled{opacity:.3;cursor:default}
.fman{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-bottom:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.fman input{flex:1 1 260px;min-width:0}
.attns{display:flex;flex-direction:column;gap:6px;padding:2px 8px 8px}
.attn{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface));color:var(--ink);border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:500}
.attn:hover{border-color:var(--warn)}
.attn b{color:var(--warn);font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
/* chips & pills */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px/1.2 var(--f-body);padding:3px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid transparent}
.chip.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.chip.muted{color:var(--ink-3);background:var(--surface-2);border-color:var(--line-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.2 var(--f-body);padding:3px 9px 3px 7px;border-radius:4px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c)}
.s-emitido{--c:var(--voce)} .s-comentarios{--c:var(--proj)} .s-aprovado{--c:var(--apr)}
.s-sptrans{--c:var(--sp)} .s-ajustes{--c:var(--proj)} .s-aprovado_sp{--c:var(--fim)}
.s-upd{--c:var(--crit)}

/* group matrix */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tscroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:center;white-space:nowrap}
.matrix th{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);vertical-align:bottom}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix td:first-child{font-weight:500;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.matrix td.c button{min-width:34px;border:0;border-radius:4px;padding:3px 6px;cursor:pointer;font:600 13px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink);background:color-mix(in srgb,var(--c) calc(var(--a) * 1%),transparent)}
.matrix td.c button:hover{outline:1px solid var(--c)}
.matrix td.z{color:var(--line)}
.matrix td.late b{color:var(--crit)}
.matrix tfoot td{font-weight:600;border-bottom:0}

.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:980px){.two{grid-template-columns:1fr}}

/* básico */
.bas{display:flex;flex-direction:column}
.bas-c{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bas-c .bas-n{font:600 13px/1.2 var(--f-body);color:var(--ink-2);margin-right:4px}
.bas-c .pill{cursor:pointer;border:0;font-size:12px}
.bas-c .pill:hover{filter:brightness(.95);outline:1px solid var(--line)}
.ep-l{display:flex;flex-direction:column;gap:6px}
.ep-o{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer}
.ep-o:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.ep-o small{display:block;color:var(--ink-3);font-size:12px}
.ep-o .ep-n{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.fh-list{display:flex;flex-direction:column;gap:10px}
.fh-e{border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;background:var(--surface)}
.fh-e .fh-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12.5px;color:var(--ink-3)}
.fh-e .fh-top b{color:var(--ink);font-size:13.5px}
.fh-e ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.fh-e .fh-m{margin-top:6px;font-size:13px}
.fh-e .fh-m.none{color:var(--ink-3);font-style:italic}
.fh-e .fh-edit{display:flex;gap:6px;margin-top:6px}.fh-e .fh-edit input{flex:1;min-width:0}
.bas-h{display:flex;justify-content:space-between;gap:8px;padding:12px 8px 4px;font:600 11px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.bas-h:first-child{padding-top:4px}
.bas-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 8px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;border-radius:6px}
.bas-row:hover{background:var(--surface-2)}
.bas-row:last-child{border-bottom:0}
.bas-row .m{font-size:12.5px;color:var(--ink-3)}
.b-aprovado{--c:var(--apr)} .b-analise{--c:var(--sp)} .b-reprovado{--c:var(--crit)} .b-nd{--c:var(--ink-3)}

/* stats */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nk = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const discLabel = n => { const m = n.match(/^([A-Z]{2,4})\s*-\s*(.+)$/); return m ? `<span class="mono" style="color:var(--ink-3);font-size:11.5px">${esc(m[1])}</span> ${esc(m[2])}` : esc(n); };
const ORD = ['sp','ok','dev'], CLS = {sp:'t-sp', ok:'t-ok', dev:'t-dev'};
const SL = D.sit, SLp = {sp: (SL.sp||'').replace(/^Enviado/, 'enviados'), ok: (SL.ok||'').replace(/^Aprovado/, 'aprovados'), dev: 'em desenvolvimento'};
const C = (SL.sp || 'Enviado à SPTrans').replace(/^Enviado à /, '');
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e){} };
const load = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
let B = load('pubBloco') || '', T = '', S = '';
let OPEN = new Set(); try { OPEN = new Set(JSON.parse(load('pubAbertos') || '[]')); } catch(e){}
const saveOpen = () => store('pubAbertos', JSON.stringify([...OPEN]));
const blocoOf = t => (t.hint.match(/^Bloco ([A-Z])/) || [,''])[1];
document.getElementById('pubUpd').innerHTML = D.upd ? `Atualizado em <b>${esc(D.upd)}</b>` : '';
function cnt(arr){ const c = {sp:0, ok:0, dev:0}; arr.forEach(d => c[d.k]++); return c; }
const bar = (c, n) => n ? `<span class="sbar" role="img" aria-label="${esc(ORD.map(k => SL[k] + ': ' + c[k]).join(' · '))}" title="${esc(ORD.map(k => SL[k] + ': ' + c[k]).join(' · '))}">${ORD.map(k => c[k] ? `<i class="${CLS[k]}" style="width:${(c[k]/n*100).toFixed(2)}%"></i>` : '').join('')}</span>` : '';
const tags = c => ORD.filter(k => c[k]).map(k => `<span class="tag ${CLS[k]}"><b>${c[k]}</b> ${esc(SLp[k])}</span>`).join('');
const pct = (c, n) => n ? Math.round((c.sp + c.ok) / n * 100) : 0;
function render(){
  const el = document.getElementById('andSec');
  if (B && !D.blocos.some(x => x.b === B)) B = '';
  const tB = D.terms.filter(t => !B || blocoOf(t) === B);
  if (T && !tB.some(t => nk(t.terminal) === nk(T))) T = '';
  const ts = tB.filter(t => !T || nk(t.terminal) === nk(T));
  const all = ts.flatMap(t => t.discs.flatMap(d => d.docs)), cA = cnt(all);
  const row = d => `<tr><td class="nw mono">${esc(d.cod)}</td><td><div class="t" style="min-width:180px">${esc(d.tit || d.cod)}</div></td><td class="nw mono">${esc(d.rev || '—')}</td><td>${d.sit}</td><td class="nw">${d.env}</td></tr>`;
  const card = t => {
    const arr = t.discs.flatMap(d => d.docs), c = cnt(arr), n = arr.length;
    const discs = t.discs.map(x => {
      const vis = x.docs.filter(d => !S || d.k === S); if (!vis.length) return '';
      const c2 = cnt(x.docs), k = t.terminal + '|' + x.dn, op = OPEN.has(k);
      return `<div class="and-d"><button type="button" class="and-dh" data-x="${esc(k)}" aria-expanded="${op}"><span class="chev" aria-hidden="true">▶</span><span class="dn">${discLabel(x.dn)}</span>${bar(c2, x.docs.length)}<span class="and-tags">${tags(c2)}</span><span class="n">${x.docs.length}</span></button>
        <div class="and-db"${op ? '' : ' hidden'}><div class="tscroll"><table class="dtab"><thead><tr><th>Código</th><th>Documento</th><th>Rev. atual</th><th>Situação</th><th>Protocolo · envio</th></tr></thead><tbody>${vis.map(row).join('')}</tbody></table></div></div></div>`; }).join('');
    if (S && !discs) return '';
    return `<section class="panel and-t"><div class="panel-h"><h2>${esc(t.terminal)}</h2><span class="hint">${esc(t.hint)}</span></div>
      ${n ? `<div class="and-sum"><span class="big">${n}</span><span style="color:var(--ink-2)">documentos</span>${bar(c, n)}<span class="pct"><b>${pct(c, n)}%</b> já enviados à ${esc(C)}</span><span class="and-tags">${tags(c)}</span></div>${discs}`
        : `<div class="empty" style="padding:14px 16px">Nenhum documento do projeto executivo emitido ainda.</div>`}</section>`; };
  const body = ts.map(card).join('');
  el.innerHTML = `<div class="and-top"><div class="hint">Situação de cada documento do projeto executivo por terminal e disciplina. Clique na disciplina para ver os documentos.</div>
    <div class="and-bar"><div class="and-f"><div class="tpills" role="group" aria-label="Filtrar por bloco"><span class="eyebrow" style="margin-right:4px">Bloco</span><button type="button" data-b="" aria-pressed="${!B}">Todos</button>${D.blocos.map(x => `<button type="button" data-b="${esc(x.b)}" aria-pressed="${B===x.b}">${esc(x.label)}</button>`).join('')}</div>
      <label class="cpe-sel"><span class="eyebrow">Terminal</span><select data-t><option value="">Todos</option>${tB.map(t => `<option value="${esc(t.terminal)}"${nk(T) === nk(t.terminal) ? ' selected' : ''}>${esc(t.terminal)}</option>`).join('')}</select></label></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small ghost" type="button" data-all="1">Expandir todas</button><button class="btn small ghost" type="button" data-all="0">Recolher todas</button></div></div>
    <div class="tpills" role="group" aria-label="Filtrar por situação"><span class="eyebrow" style="margin-right:4px">Situação</span><button type="button" data-s="" aria-pressed="${!S}">Todas<b>${all.length}</b></button>${ORD.map(k => `<button type="button" data-s="${k}" aria-pressed="${S===k}">${esc(SL[k])}<b>${cA[k]}</b></button>`).join('')}</div>
    ${all.length ? `<div class="panel"><div class="and-sum" style="border-bottom:0"><span class="big">${all.length}</span><span style="color:var(--ink-2)">documentos ${T ? 'neste terminal' : B ? 'no Bloco ' + esc(B) : 'no total'}</span>${bar(cA, all.length)}<span class="pct"><b>${pct(cA, all.length)}%</b> já enviados à ${esc(C)}</span><span class="and-tags">${tags(cA)}</span></div></div>` : ''}
    <p class="and-leg"><span><span class="tag t-sp">${esc(SL.sp)}</span> revisão protocolada na ${esc(C)}, aguardando retorno</span><span><span class="tag t-ok">${esc(SL.ok)}</span> aprovado pela ${esc(C)}</span><span><span class="tag t-dev">${esc(SL.dev)}</span> em elaboração ou ajuste pelo projetista, ou em análise técnica antes do envio</span></p></div>
  <div class="and-grid">${body || '<div class="empty" style="padding:18px 16px">Nenhum documento com esse filtro.</div>'}</div>`;
}
document.addEventListener('change', e => { const s = e.target.closest && e.target.closest('select[data-t]'); if (s) { T = s.value; render(); } });
document.addEventListener('click', e => {
  if (!e.target.closest) return;
  const b = e.target.closest('[data-b]'); if (b) { B = b.dataset.b; T = ''; store('pubBloco', B); render(); return; }
  const s = e.target.closest('[data-s]'); if (s) { S = s.dataset.s; render(); return; }
  const x = e.target.closest('[data-x]'); if (x) { const k = x.dataset.x, op = !OPEN.has(k); op ? OPEN.add(k) : OPEN.delete(k); saveOpen(); x.setAttribute('aria-expanded', String(op)); const nx = x.nextElementSibling; if (nx) nx.hidden = !op; return; }
  const a = e.target.closest('[data-all]'); if (a) { document.querySelectorAll('#andSec [data-x]').forEach(y => a.dataset.all === '1' ? OPEN.add(y.dataset.x) : OPEN.delete(y.dataset.x)); saveOpen(); render(); }
});
render();
})();
